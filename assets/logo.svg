<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Origin Movers">
  <title>Origin Movers</title>
  <!-- Знак: коробка в изометрии — «origin», точка отправления переезда.
       Цвета сайта: тёмно-синий #0C1E3C и оранжевый #E86A0C. -->
  <rect width="64" height="64" rx="13" fill="#0C1E3C"/>
  <g fill="none" stroke="#E86A0C" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M32 13 15 21.5v21L32 51l17-8.5v-21Z"/>
