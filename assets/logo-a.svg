<!--
  Вариант A — «Established Crest».
  Полноценный герб перевозчика: гильошированное двойное кольцо с зубцами,
  ленточный картуш EST. 2024, внутри — фургон под аркой моста Денвера,
  под ним горная гряда Front Range, сверху компасная роза (origin = точка старта).
  Рассчитан на 512 px; для 32 px есть упрощённая версия logo-a-mini.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640"
     role="img" aria-label="Origin Movers">
  <defs>
    <linearGradient id="aNavy" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#1B3766"/><stop offset=".55" stop-color="#12294C"/>
      <stop offset="1" stop-color="#0A1930"/>
    </linearGradient>
    <linearGradient id="aOr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA24D"/><stop offset=".5" stop-color="#F0770F"/>
      <stop offset="1" stop-color="#C85508"/>
    </linearGradient>
    <linearGradient id="aSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- зубчатый ободок печати -->
    <pattern id="aTeeth" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="16" fill="#E86A0C"/>
    </pattern>
    <clipPath id="aClip"><circle cx="320" cy="300" r="196"/></clipPath>
  </defs>

  <!-- зубчатое внешнее кольцо -->
  <circle cx="320" cy="300" r="252" fill="url(#aOr)"/>
  <circle cx="320" cy="300" r="252" fill="none" stroke="#0A1930" stroke-width="6"/>
  <g>
    <circle cx="320" cy="300" r="238" fill="none" stroke="url(#aTeeth)" stroke-width="26" opacity=".55"/>
  </g>
  <circle cx="320" cy="300" r="226" fill="url(#aNavy)"/>
  <circle cx="320" cy="300" r="226" fill="none" stroke="#E86A0C" stroke-width="3" opacity=".9"/>
  <circle cx="320" cy="300" r="205" fill="none" stroke="#2B4B7E" stroke-width="2"/>

  <!-- гильоше: тонкие лучи по кольцу -->
  <g stroke="#2B4B7E" stroke-width="2" opacity=".65">
    <g id="aRays">
      <path d="M320 84 v20"/><path d="M320 496 v-20"/>
      <path d="M104 300 h20"/><path d="M536 300 h-20"/>
      <path d="M167 147 l14 14"/><path d="M473 453 l-14 -14"/>
      <path d="M473 147 l-14 14"/><path d="M167 453 l14 -14"/>
    </g>
  </g>

  <!-- компасная роза сверху -->
  <g transform="translate(320 128)">
    <path d="M0 -34 L9 -9 L34 0 L9 9 L0 34 L-9 9 L-34 0 L-9 -9 Z" fill="url(#aOr)"/>
    <circle cx="0" cy="0" r="6" fill="#0A1930"/>
  </g>

  <g clip-path="url(#aClip)">
    <!-- небо и солнце -->
    <circle cx="320" cy="300" r="196" fill="#12294C"/>
    <circle cx="430" cy="214" r="34" fill="#E86A0C" opacity=".22"/>

    <!-- горная гряда Front Range -->
    <path d="M124 372 l64 -78 l40 44 l58 -80 l52 66 l46 -40 l72 88 v90 H124 z" fill="#1B3766"/>
    <path d="M124 372 l64 -78 l22 26 l-52 52 z" fill="#24457C" opacity=".8"/>
    <path d="M284 258 l24 30 l-40 22 z" fill="#FFFFFF" opacity=".55"/>
    <path d="M406 282 l30 36 l-52 20 z" fill="#FFFFFF" opacity=".4"/>

    <!-- дорога уходит вглубь -->
    <path d="M232 496 L296 388 h48 l64 108 z" fill="#0A1930"/>
    <path d="M320 388 v108" stroke="#E86A0C" stroke-width="6" stroke-dasharray="16 14"/>

    <!-- фургон в профиль -->
    <g transform="translate(196 300)">
      <rect x="0" y="0" width="150" height="96" rx="10" fill="#FFFFFF"/>
      <rect x="14" y="14" width="122" height="68" rx="6" fill="none" stroke="#0A1930" stroke-width="7"/>
      <path d="M75 14 v68 M14 48 h122" stroke="#0A1930" stroke-width="7"/>
      <path d="M150 26 h42 l40 46 v24 h-82 z" fill="url(#aOr)"/>
      <path d="M160 36 h28 l26 32 h-54 z" fill="#0A1930" opacity=".85"/>
      <rect x="0" y="96" width="232" height="12" rx="6" fill="#E86A0C"/>
      <circle cx="46" cy="118" r="26" fill="#0A1930" stroke="#FFFFFF" stroke-width="7"/>
      <circle cx="46" cy="118" r="9" fill="#E86A0C"/>
      <circle cx="186" cy="118" r="26" fill="#0A1930" stroke="#FFFFFF" stroke-width="7"/>
      <circle cx="186" cy="118" r="9" fill="#E86A0C"/>
    </g>

    <!-- блик -->
    <circle cx="320" cy="300" r="196" fill="url(#aSheen)"/>
  </g>

  <!-- лента-картуш -->
  <path d="M96 470 h448 l-34 46 H130 z" fill="#0A1930"/>
  <path d="M96 470 l-30 30 l30 16 z" fill="#C85508"/>
  <path d="M544 470 l30 30 l-30 16 z" fill="#C85508"/>
  <path d="M110 478 h420 l-26 32 H136 z" fill="url(#aOr)"/>
  <text x="320" y="502" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="26" font-weight="700" letter-spacing="6" fill="#0A1930">EST. DENVER CO</text>

  <!-- кольцевая надпись -->
  <path id="aArc" d="M320 106 a194 194 0 0 1 0 388 a194 194 0 0 1 0 -388" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="27" letter-spacing="9"
        fill="#FFFFFF" opacity=".92">
    <textPath href="#aArc" startOffset="25%" text-anchor="middle">ORIGIN · MOVERS</textPath>
  </text>
</svg>
