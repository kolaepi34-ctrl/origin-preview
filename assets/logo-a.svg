<!--
  Origin Movers — «Established Crest», третья редакция.

  Геометрия пересчитана, зоны не пересекаются:
    холст            640 × 640
    центр эмблемы    320 / 292
    внешний кант     r 250 … 236   (оранжевый с зубцами)
    поле надписи     r 232 … 188   (текст по дуге, сюда рисунок не заходит)
    медальон         r 178          (весь сюжет внутри, обрезан по кругу)
    лента            y 470 … 556    (ниже медальона, текст внутри ленты)
  Поэтому под колёсами больше ничего не просвечивает, а нижняя строка
  целиком помещается в холст.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640"
     role="img" aria-label="Origin Movers — Denver, Colorado">
  <defs>
    <linearGradient id="cNavy" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#1D3A6B"/><stop offset=".55" stop-color="#12294C"/>
      <stop offset="1" stop-color="#0A1930"/>
    </linearGradient>
    <linearGradient id="cOr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFAE5E"/><stop offset=".5" stop-color="#F0770F"/>
      <stop offset="1" stop-color="#BE5207"/>
    </linearGradient>
    <linearGradient id="cSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD3A1"/><stop offset="1" stop-color="#F0770F"/>
    </linearGradient>
    <linearGradient id="cGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cTeeth" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="9" height="18" fill="#0A1930" opacity=".55"/>
    </pattern>
    <clipPath id="cMedal"><circle cx="320" cy="292" r="178"/></clipPath>
    <!-- дуга надписи: слева направо через верх, поэтому 50 % — точный центр -->
    <path id="cArcTop" d="M110 292 A210 210 0 0 1 530 292" fill="none"/>
  </defs>

  <!-- ── внешний кант ─────────────────────────────────────────────── -->
  <circle cx="320" cy="292" r="250" fill="url(#cOr)"/>
  <circle cx="320" cy="292" r="250" fill="none" stroke="#0A1930" stroke-width="5"/>
  <circle cx="320" cy="292" r="243" fill="none" stroke="url(#cTeeth)" stroke-width="14"/>
  <circle cx="320" cy="292" r="236" fill="url(#cNavy)"/>
  <circle cx="320" cy="292" r="236" fill="none" stroke="#0A1930" stroke-width="4"/>

  <!-- ── поле надписи ─────────────────────────────────────────────── -->
  <circle cx="320" cy="292" r="188" fill="none" stroke="#E86A0C" stroke-width="3"/>
  <circle cx="320" cy="292" r="182" fill="none" stroke="#2B4B7E" stroke-width="2"/>
  <text font-family="Georgia,'Times New Roman',serif" font-size="40" font-weight="700"
        letter-spacing="12" fill="#FFFFFF">
    <textPath href="#cArcTop" startOffset="50%" text-anchor="middle">ORIGIN MOVERS</textPath>
  </text>
  <!-- ромбы-разделители на уровне центра -->
  <g fill="#E86A0C">
    <path d="M112 292 l12 -12 l12 12 l-12 12 z"/>
    <path d="M504 292 l12 -12 l12 12 l-12 12 z"/>
  </g>

  <!-- ── медальон ─────────────────────────────────────────────────── -->
  <g clip-path="url(#cMedal)">
    <circle cx="320" cy="292" r="178" fill="#12294C"/>

    <!-- закатное солнце -->
    <circle cx="320" cy="250" r="96" fill="#E86A0C" opacity=".14"/>
    <circle cx="320" cy="252" r="58" fill="url(#cSun)"/>

    <!-- Front Range -->
    <path d="M142 296 l60 -66 l40 46 l54 -60 l46 54 l52 -42 l64 80 v64 H142 z" fill="#16305C"/>
    <path d="M256 216 l22 26 l-38 20 z" fill="#FFFFFF" opacity=".5"/>
    <path d="M374 230 l24 30 l-44 18 z" fill="#FFFFFF" opacity=".34"/>

    <!-- силуэт Денвера: небо над фургоном заполнено городом -->
    <g fill="#0A1930">
      <rect x="150" y="300" width="32" height="70"/>
      <rect x="190" y="278" width="26" height="92"/>
      <path d="M224 284 l19 -26 l19 26 v112 h-38 z"/>
      <rect x="272" y="266" width="32" height="104"/>
      <rect x="312" y="294" width="24" height="76"/>
      <path d="M344 306 h38 v64 h-38 z"/>
      <rect x="392" y="286" width="28" height="84"/>
      <rect x="428" y="314" width="32" height="56"/>
    </g>
    <g fill="#E86A0C" opacity=".92">
      <rect x="157" y="312" width="7" height="9"/><rect x="169" y="334" width="7" height="9"/>
      <rect x="197" y="292" width="7" height="9"/><rect x="203" y="320" width="7" height="9"/>
      <rect x="281" y="280" width="7" height="9"/><rect x="290" y="312" width="7" height="9"/>
      <rect x="319" y="308" width="7" height="9"/><rect x="355" y="322" width="7" height="9"/>
      <rect x="399" y="300" width="7" height="9"/><rect x="437" y="330" width="7" height="9"/>
    </g>

    <!-- дорога: под фургоном, до нижнего края медальона -->
    <path d="M142 370 h356 v106 H142 z" fill="#0E2646"/>
    <path d="M142 398 h356" stroke="#2B4B7E" stroke-width="3"/>
    <path d="M142 442 h356" stroke="#E86A0C" stroke-width="8" stroke-dasharray="28 22"/>

    <!-- фургон -->
    <g transform="translate(170 330)">
      <rect x="0" y="0" width="164" height="82" rx="9" fill="#FFFFFF"/>
      <rect x="12" y="12" width="140" height="58" rx="5" fill="none" stroke="#0A1930" stroke-width="7"/>
      <path d="M82 12 v58 M12 41 h140" stroke="#0A1930" stroke-width="7"/>
      <path d="M164 22 h42 l38 42 v18 h-80 z" fill="url(#cOr)"/>
      <path d="M175 32 h28 l26 28 h-54 z" fill="#0A1930" opacity=".85"/>
      <rect x="0" y="82" width="244" height="12" rx="6" fill="#E86A0C"/>
      <circle cx="48" cy="106" r="24" fill="#0A1930" stroke="#FFFFFF" stroke-width="7"/>
      <circle cx="48" cy="106" r="9" fill="#E86A0C"/>
      <circle cx="194" cy="106" r="24" fill="#0A1930" stroke="#FFFFFF" stroke-width="7"/>
      <circle cx="194" cy="106" r="9" fill="#E86A0C"/>
    </g>

    <circle cx="320" cy="292" r="178" fill="url(#cGloss)"/>
  </g>

  <!-- ── лента: ниже медальона, целиком в холсте ──────────────────── -->
  <path d="M96 470 h448 v56 l-24 22 H120 l-24 -22 z" fill="#0A1930"/>
  <path d="M96 470 l-34 26 l34 20 z" fill="#BE5207"/>
  <path d="M544 470 l34 26 l-34 20 z" fill="#BE5207"/>
  <path d="M110 478 h420 v42 l-16 14 H126 l-16 -14 z" fill="url(#cOr)"/>
  <text x="320" y="512" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="27" font-weight="700" letter-spacing="9" fill="#0A1930">DENVER · COLORADO</text>
</svg>
